name: Build installers and native drivers
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build for manual validation
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
permissions:
  contents: read
jobs:
  portable:
    uses: ./.github/workflows/native-checks.yml
  runtime-linux:
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'linux' }}
    needs: portable
    uses: ./.github/workflows/native-runtime.yml
    with:
      os: ubuntu-22.04
      name: linux-x86_64
  runtime-macos:
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'macos' }}
    needs: portable
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-aarch64
          - os: macos-15-intel
            name: macos-x86_64
    uses: ./.github/workflows/native-runtime.yml
    with:
      os: ${{ matrix.os }}
      name: ${{ matrix.name }}
  linux:
    needs: [portable, runtime-linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package inspection and RPM build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm rpm2cpio cpio
      - run: cargo build --locked --release --bins
      - name: Check release CLI without audio or user configuration
        run: python3 scripts/test_cli_smoke.py --output-dir artifacts/cli-smoke
      - uses: actions/download-artifact@v4
        with:
          pattern: babel-local-runtime-linux-*
          merge-multiple: true
          path: artifacts/runtime-archives
      - name: Extract and verify bundled inference runtimes
        run: python scripts/build_local_runtime.py --extract-artifacts artifacts/runtime-archives --output artifacts/local-runtime
      - name: Build and inspect DEB, RPM and portable archive
        run: python3 packaging/linux/build.py --bin-dir target/release --runtime-dir artifacts/local-runtime --output artifacts/installers
      - uses: actions/upload-artifact@v4
        with:
          name: babel-installers-linux-amd64
          path: artifacts/installers/
          if-no-files-found: error
          retention-days: 30
  macos:
    needs: [portable, runtime-macos]
    runs-on: macos-15
    timeout-minutes: 50
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build both application architectures and combine them
        run: |
          set -euo pipefail
          cargo build --locked --release --bins --target aarch64-apple-darwin
          cargo build --locked --release --bins --target x86_64-apple-darwin
          mkdir -p artifacts/universal
          for binary in babel babel-tray babel-feedback; do
            lipo -create "target/aarch64-apple-darwin/release/$binary" "target/x86_64-apple-darwin/release/$binary" -output "artifacts/universal/$binary"
            lipo "artifacts/universal/$binary" -verify_arch arm64 x86_64
            chmod 755 "artifacts/universal/$binary"
            codesign --force --sign - "artifacts/universal/$binary"
          done
          python3 scripts/test_cli_smoke.py --babel artifacts/universal/babel --output-dir artifacts/cli-smoke
      - name: Build and test universal HAL driver with Apple SDK
        run: python3 native/macos/build.py --unsigned --arch universal --test --pkg
      - uses: actions/download-artifact@v4
        with:
          pattern: babel-local-runtime-macos-*
          merge-multiple: true
          path: artifacts/runtime-archives
      - name: Extract and verify bundled inference runtimes
        run: python scripts/build_local_runtime.py --extract-artifacts artifacts/runtime-archives --output artifacts/local-runtime
      - name: Build and expand complete application and driver PKG
        run: python3 packaging/macos/build.py --unsigned --arch universal --runtime-dir artifacts/local-runtime --bin-dir artifacts/universal --driver-dir native/macos/dist --output artifacts/installers
      - name: Publish development installer (no distribution signature)
        uses: actions/upload-artifact@v4
        with:
          name: babel-installers-macos-universal-development
          path: |
            artifacts/installers/*.pkg
            artifacts/installers/*.json
            artifacts/installers/*.txt
          if-no-files-found: error
          retention-days: 30
  windows:
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'windows' }}
    needs: portable
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
            runtime-name: windows-x86_64
          - architecture: ARM64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            runtime-name: windows-aarch64
    uses: ./.github/workflows/native-windows.yml
    with:
      runner: ${{ matrix.runner }}
      runtime-name: ${{ matrix.runtime-name }}
      architecture: ${{ matrix.architecture }}
      target: ${{ matrix.target }}
