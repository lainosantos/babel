version = 1

# Display language: system (OS language, English fallback), en or pt.
# Independent of source_language / target_language on each audio route.
[interface]
language = "system"

[providers.gemini]
api_key_env = "GEMINI_API_KEY"
endpoint = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent"
model = "gemini-3.5-live-translate-preview"
voice = "Kore"
tts_model = "gemini-3.8-flash-tts"
transcription_model = ""
connect_timeout_secs = 15
max_reconnect_attempts = 5

[providers.openai]
api_key_env = "OPENAI_API_KEY"
endpoint = ""
model = "gpt-realtime-translate"
voice = "marin"
tts_model = ""
transcription_model = ""
connect_timeout_secs = 15
max_reconnect_attempts = 5

[providers.elevenlabs]
api_key_env = "ELEVENLABS_API_KEY"
endpoint = "https://api.elevenlabs.io/v1"
model = "eleven_flash_v2_5"
voice = ""
tts_model = "eleven_flash_v2_5"
transcription_model = ""
connect_timeout_secs = 15
max_reconnect_attempts = 5

[providers.local]
# Selection downloads weights; sessions load the engines only for enabled features.
whisper_endpoint = "auto"
whisper_model = "base-q5_1"
ollama_endpoint = "auto"
translation_api = "ollama" # Only used for an explicitly configured external endpoint.
translation_model = "qwen3-0.6b"
piper_endpoint = "auto"
piper_voice = "auto"
segment_ms = 2000
silence_ms = 300
vad_threshold = 0.01
request_timeout_secs = 30

[local_runtime]
# Empty uses the current account's application cache; explicit paths must be absolute.
directory = ""
threads = 2
idle_unload_secs = 60 # Release session models from RAM after this idle interval.

[audio]
quality = "balanced"
capture_queue_ms = 200
playback_queue_ms = 2000
max_capture_age_ms = 200
device_latency_ms = 30

[microphone]
enabled = true
provider = "gemini"
capture_device = ""
playback_device = "babel_mic_bus"
source_language = "pt-BR"
target_language = "en-US"
prompt = ""
gain = 1.0

[microphone.voice]
engine = "native"
voice_id = ""
style = ""
chunk_ms = 400

[speaker]
enabled = true
provider = "gemini"
capture_device = "babel_speaker.monitor"
playback_device = ""
source_language = "en-US"
target_language = "pt-BR"
prompt = ""
gain = 1.0

[speaker.voice]
engine = "native"
voice_id = ""
style = ""
chunk_ms = 400

[transcription]
enabled = false
microphone = true
speaker = true
timestamps = true
directory = "transcripts"

# Original-speech recognition is independent of translation and voices.
[transcription.microphone_recognition]
provider = "gemini" # gemini, openai, deepgram or whisper
language = "auto"

[transcription.speaker_recognition]
provider = "gemini"
language = "auto"

[transcription.providers.gemini]
api_key_env = "GEMINI_API_KEY" # May differ from the translation profile's key.
endpoint = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent"
model = "gemini-3.5-transcribe-live"
connect_timeout_secs = 15
max_reconnect_attempts = 5

[transcription.providers.openai]
api_key_env = "OPENAI_API_KEY"
endpoint = "" # Official recognition endpoint; never /translations.
model = "gpt-live-transcribe"
connect_timeout_secs = 15
max_reconnect_attempts = 5

[transcription.providers.deepgram]
api_key_env = "DEEPGRAM_API_KEY"
endpoint = "wss://api.deepgram.com/v1/listen"
model = "nova-3"
connect_timeout_secs = 15
max_reconnect_attempts = 3
diarize = true
punctuate = true

[transcription.providers.whisper]
endpoint = "auto" # Built-in engine with a dynamically assigned local port.
model = "base-q5_1" # Multilingual compact default; tiny-q5_1 and small-q5_1 also available.
api_key_env = "" # Optional only for an external endpoint; never store a secret here.
segment_ms = 2000
silence_ms = 300
vad_threshold = 0.01
request_timeout_secs = 30

[recording]
enabled = false
microphone = true
speaker = true
directory = "recordings"

[files]
# Set an absolute base folder; choose and adapt one of the examples below.
# babel init uses HOME/Babel (Linux/macOS) or USERPROFILE\Babel (Windows).
# Existing TOML files without this field are migrated on load: Babel uses the
# configuration file’s directory as the base and saves its absolute path.
# base_path = '/home/ana/Babel'
# base_path = '/Users/ana/Babel'
# base_path = 'C:\Users\Ana\Babel'
name_pattern = "{date}-{time}-{session}-{id}"

[agent]
whisper_model = "base-q5_1" # Managed command recognizer, installed by setup_whisper.py.
local_threads = 2 # Whisper only, bounded by available CPUs.
idle_unload_secs = 60 # Whisper after mic inactivity; Needle after the last command.
