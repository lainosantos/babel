name: Babel CI
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: babel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conventional-commits:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate new commit subjects and pull request title
        run: python .github/scripts/conventional_commits.py
  checks:
    uses: ./.github/workflows/checks.yml
