name: Native and package checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  portable:
    env:
      RUST_TEST_THREADS: '4'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux package validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm rpm2cpio cpio
      - name: Windows physical volume control checks
        run: |
          set -euo pipefail
          cargo fmt --manifest-path native/windows/volume-control/Cargo.toml -- --check
          cargo test --locked --manifest-path native/windows/volume-control/Cargo.toml
          cargo clippy --locked --manifest-path native/windows/volume-control/Cargo.toml --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - name: Installer and runtime package contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s packaging/windows -p 'test_*.py' -v
          python3 -m unittest discover -s packaging/macos -p 'test_*.py' -v
          python3 -m unittest discover -s packaging/linux -p 'test_*.py' -v
          python3 -m unittest discover -s scripts -p test_local_runtime.py -v
          python3 -m unittest discover -s scripts -p test_bundled_inference_contracts.py -v
