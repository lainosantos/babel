name: Documentation site
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ui/README.md'
      - 'ui/DESIGN.md'
      - 'ui/fonts/**'
      - 'assets/README.md'
      - 'assets/fonts/README.md'
      - 'assets/babel.svg'
      - 'packaging/**/README.md'
      - 'native/**/README.md'
      - 'scripts/build_site.py'
      - 'scripts/test_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: babel-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Install documentation renderer
        run: python -m pip install -r site/requirements.txt
      - name: Test and build the documentation site
        run: |
          python -m unittest discover -s scripts -p test_site.py -v
          python scripts/build_site.py --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
