[package]
name = "babel-driver-installer"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties",
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation",
] }

[profile.release]
panic = "abort"
lto = "thin"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
