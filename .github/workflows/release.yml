name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: babel-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require SemVer and matching package version
        id: validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/release_assets.py --tag "$RELEASE_TAG"
  checks:
    needs: version
    uses: ./.github/workflows/checks.yml
  installers:
    needs: checks
    uses: ./.github/workflows/native-drivers.yml
  publish:
    needs: [version, checks, installers]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: babel-*
          path: artifacts/downloaded
      - name: Require all platforms and prepare every payload with checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/release_assets.py --tag "$RELEASE_TAG" --source artifacts/downloaded --output artifacts/release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/babel-release-state.json" 2>/dev/null; then
            python -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["isDraft"] else "Release already published; existing assets are immutable to this workflow")' "$RUNNER_TEMP/babel-release-state.json"
            gh release upload "$RELEASE_TAG" artifacts/release/* --clobber
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" artifacts/release/* \
              --verify-tag --draft --generate-notes --title "Babel $RELEASE_TAG" \
              --notes-file .github/RELEASE_NOTES.md "${flags[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
