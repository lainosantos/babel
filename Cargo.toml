[package]
name = "babel-audio"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Bidirectional streaming speech translation through selectable virtual audio devices"
license = "MIT"
default-run = "babel"

[lib]
name = "babel_audio"
path = "src/lib.rs"

[[bin]]
name = "babel"
path = "src/main.rs"

[[bin]]
name = "babel-tray"
path = "src/bin/babel-tray.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chacha20poly1305 = "0.10.1"
futures-util = { version = "0.3", features = ["sink"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
sse-stream = "0.2.4"
hound = "3.5"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3.2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "process", "io-util", "fs", "test-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1.8"
earshot = "=1.2.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = { version = "0.18.2", features = ["realtime"] }
crossbeam-queue = "0.3"
tray-icon = { version = "0.25", default-features = false }
tao = "0.34"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
affinity = "0.1.2"

[target.'cfg(target_os = "windows")'.dependencies]
babel-windows-volume = { path = "native/windows/volume-control" }
wasapi = "0.24"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio_hal = { package = "coreaudio", version = "=0.3.3", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
